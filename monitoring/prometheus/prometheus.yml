# Prometheus Configuration for Eleanor Platform
# Scrapes metrics from the arbitrage orchestrator

global:
  scrape_interval: 15s  # Scrape metrics every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    monitor: 'eleanor-arbitrage'
    environment: 'production'

# Alertmanager configuration (optional - for production alerts)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules files
# rule_files:
#   - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Eleanor Platform arbitrage orchestrator
  - job_name: 'eleanor-arbitrage'
    static_configs:
      - targets: ['arbitrage:8000']
    scrape_interval: 10s  # More frequent scraping for trading metrics
    scrape_timeout: 5s
    metrics_path: '/metrics'
    honor_labels: true
    labels:
      service: 'arbitrage-bot'
      component: 'trading'

  # Optional: Node Exporter for system metrics
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
